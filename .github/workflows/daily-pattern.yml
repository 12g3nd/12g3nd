name: Daily pattern

on:
  schedule:
    # Runs at 00:05 UTC every day. (GitHub Actions cron can be delayed
    # by up to ~30 min during peak load — that's fine for this.)
    - cron: '5 0 * * *'
  workflow_dispatch:  # Allow running manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate today's pattern
        run: node scripts/generate-pattern.js

      - name: Bump cache-busting query string in README
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Replace any existing pattern.svg?v=<token> with today's date.
          # Matches up to the next quote, apostrophe, space, or '>'.
          sed -i -E "s|pattern\.svg\?v=[^\"' >]+|pattern.svg?v=${TODAY}|g" README.md

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "🌀 daily pattern: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
